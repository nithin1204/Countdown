<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Countdown Timer</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap");
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "DM Sans", system-ui, sans-serif;
      }
      body {
        color: #fff;
        overflow-x: hidden;
        background: #193c72;
      }
      .page {
        min-height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        isolation: isolate;
        background: linear-gradient(
          180deg,
          #2878c9 0%,
          #548bc7 29%,
          #e99bb0 60%,
          #ff9a66 77%,
          #174b76 100%
        );
      }
      .page:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            ellipse at 50% 74%,
            rgba(255, 198, 104, 0.7) 0 8%,
            transparent 25%
          ),
          linear-gradient(
            180deg,
            transparent 0 55%,
            rgba(255, 143, 119, 0.28) 70%,
            rgba(13, 48, 82, 0.45) 100%
          );
      }
      .stars {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.45;
        background-image:
          radial-gradient(circle at 8% 16%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 77% 18%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 91% 33%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 17% 39%, #fff 0 1px, transparent 2px);
      }
      .fireworks {
        position: fixed;
        inset: 0;
        z-index: 5;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 4vw;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 27px;
        font-weight: 600;
      }
      .calendar-icon {
        width: 34px;
        height: 34px;
        border: 3px solid #fff;
        border-radius: 7px;
        position: relative;
      }
      .calendar-icon:before,
      .calendar-icon:after {
        content: "";
        position: absolute;
        top: -8px;
        width: 4px;
        height: 10px;
        background: #fff;
        border-radius: 2px;
      }
      .calendar-icon:before {
        left: 7px;
      }
      .calendar-icon:after {
        right: 7px;
      }
      .calendar-icon span {
        position: absolute;
        left: 5px;
        right: 5px;
        top: 9px;
        border-top: 3px solid #fff;
      }
      .share {
        border: 1px solid rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border-radius: 30px;
        padding: 12px 18px;
        font: 600 16px inherit;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: 0.2s;
      }
      .share:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-1px);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 50px 20px 35px;
      }
      .kicker {
        font-size: 16px;
        letter-spacing: 8px;
        font-weight: 600;
        margin-bottom: 18px;
        text-shadow: 0 2px 12px #315b8a;
      }
      h1 {
        font-family: Pacifico, cursive;
        font-size: clamp(58px, 8vw, 108px);
        font-weight: 400;
        line-height: 1.05;
        margin: 0 0 22px;
        text-shadow: 0 5px 22px rgba(28, 57, 92, 0.25);
      }
      .date-row {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 46px;
      }
      .mini-calendar {
        font-size: 31px;
      }
      .timer {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 22px;
        width: min(900px, 94vw);
      }
      .card {
        height: 215px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 28px;
        background: linear-gradient(
          145deg,
          rgba(96, 190, 242, 0.22),
          rgba(255, 177, 183, 0.24)
        );
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.25),
          0 18px 50px rgba(22, 55, 92, 0.12);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .num {
        font-size: clamp(55px, 7vw, 88px);
        font-weight: 700;
        line-height: 1;
      }
      .label {
        font-size: 17px;
        letter-spacing: 5px;
        font-weight: 600;
        margin-top: 22px;
      }
      footer {
        padding: 20px;
        text-align: center;
        letter-spacing: 6px;
        font-size: 13px;
      }
      @media (max-width: 760px) {
        header {
          padding: 22px 18px;
        }
        .brand {
          font-size: 20px;
          gap: 10px;
        }
        .share {
          font-size: 13px;
          padding: 10px 13px;
        }
        main {
          padding-top: 42px;
        }
        .kicker {
          font-size: 12px;
          letter-spacing: 5px;
        }
        h1 {
          font-size: 56px;
        }
        .date-row {
          font-size: 21px;
          margin-bottom: 30px;
        }
        .timer {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .card {
          height: 145px;
          border-radius: 20px;
        }
        .num {
          font-size: 53px;
        }
        .label {
          font-size: 12px;
          letter-spacing: 3px;
          margin-top: 12px;
        }
        footer {
          font-size: 10px;
          letter-spacing: 4px;
          padding-bottom: 18px;
        }
      }
      @media (max-width: 390px) {
        h1 {
          font-size: 47px;
        }
        .card {
          height: 125px;
        }
        .num {
          font-size: 45px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="stars"></div>
      <header>
        <div class="brand">
          <div class="calendar-icon"><span></span></div>
          <span>Countdown Timer</span>
        </div>
        <button class="share" id="shareBtn">
          ↗ &nbsp; Share this countdown
        </button>
      </header>
      <main>
        <div class="kicker">THE CLOCK IS TICKING...</div>
        <h1 id="title">Thailand Trip ✈</h1>
        <div class="date-row">
          <span class="mini-calendar">▣</span
          ><span id="dateText">Nov 04, 2026</span>
        </div>
        <section class="timer">
          <div class="card">
            <div class="num" id="days">00</div>
            <div class="label">DAYS</div>
          </div>
          <div class="card">
            <div class="num" id="hours">00</div>
            <div class="label">HOURS</div>
          </div>
          <div class="card">
            <div class="num" id="minutes">00</div>
            <div class="label">MINUTES</div>
          </div>
          <div class="card">
            <div class="num" id="seconds">00</div>
            <div class="label">SECONDS</div>
          </div>
        </section>
      </main>
      <footer>GOOD THINGS TAKE TIME ♡</footer>
      <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
    </div>
    <script>
      const p = new URLSearchParams(location.search),
        fallback = "2026-11-04T23:00";
      let target = p.get("date") || fallback,
        title = p.get("title") || "Thailand Trip ✈",
        end = new Date(target);
      if (isNaN(end)) end = new Date(fallback);
      const $ = (id) => document.getElementById(id);
      $("title").textContent = title;
      const fireworksCanvas = $("fireworks"),
        fireworksContext = fireworksCanvas.getContext("2d"),
        reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
      let countdownFinished = false;

      function startFireworks() {
        if (!fireworksContext) return;

        const scale = Math.min(window.devicePixelRatio || 1, 2),
          duration = reducedMotion ? 1800 : 7000,
          burstInterval = reducedMotion ? 900 : 520,
          particleCount = reducedMotion ? 22 : 52,
          colors = ["#fff3a6", "#ffadad", "#a6f7ff", "#ffffff"];
        let particles = [],
          startedAt = performance.now(),
          lastBurst = 0;

        function resizeCanvas() {
          fireworksCanvas.width = Math.floor(window.innerWidth * scale);
          fireworksCanvas.height = Math.floor(window.innerHeight * scale);
          fireworksContext.setTransform(scale, 0, 0, scale, 0, 0);
        }

        function burst() {
          const x = window.innerWidth * (0.12 + Math.random() * 0.76),
            y = window.innerHeight * (0.12 + Math.random() * 0.42);

          for (let i = 0; i < particleCount; i++) {
            const angle = (Math.PI * 2 * i) / particleCount,
              speed = 1.2 + Math.random() * 3.8;
            particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 45 + Math.random() * 30,
              maxLife: 75,
              color: colors[Math.floor(Math.random() * colors.length)],
            });
          }
        }

        function animate(now) {
          const elapsed = now - startedAt;
          fireworksContext.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight,
          );
          if (elapsed - lastBurst >= burstInterval && elapsed < duration) {
            burst();
            lastBurst = elapsed;
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            const particle = particles[i];
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.vy += 0.035;
            particle.vx *= 0.99;
            particle.life--;

            if (particle.life <= 0) {
              particles.splice(i, 1);
              continue;
            }

            fireworksContext.globalAlpha = particle.life / particle.maxLife;
            fireworksContext.strokeStyle = particle.color;
            fireworksContext.lineWidth = 2;
            fireworksContext.beginPath();
            fireworksContext.moveTo(
              particle.x - particle.vx * 2,
              particle.y - particle.vy * 2,
            );
            fireworksContext.lineTo(particle.x, particle.y);
            fireworksContext.stroke();
          }

          fireworksContext.globalAlpha = 1;
          if (elapsed < duration || particles.length > 0) {
            requestAnimationFrame(animate);
          } else {
            fireworksContext.clearRect(
              0,
              0,
              window.innerWidth,
              window.innerHeight,
            );
            window.removeEventListener("resize", resizeCanvas);
          }
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        burst();
        requestAnimationFrame(animate);
      }

      function update() {
        let x = Math.max(0, end - Date.now()),
          t = Math.floor(x / 1000),
          d = Math.floor(t / 86400);
        t %= 86400;
        let h = Math.floor(t / 3600);
        t %= 3600;
        let m = Math.floor(t / 60),
          s = t % 60;
        [
          ["days", d],
          ["hours", h],
          ["minutes", m],
          ["seconds", s],
        ].forEach(
          ([id, v]) => ($(id).textContent = String(v).padStart(2, "0")),
        );
        $("dateText").textContent = end.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        if (x === 0 && !countdownFinished) {
          countdownFinished = true;
          document.querySelector(".kicker").textContent =
            "THE COUNTDOWN IS OVER!";
          clearInterval(countdownInterval);
          startFireworks();
        }
      }
      function share() {
        const u = new URL(location.href);
        u.searchParams.set("date", end.toISOString());
        u.searchParams.set("title", title);
        if (navigator.share)
          navigator.share({
            title: title,
            text: "Countdown to " + title,
            url: u.href,
          });
        else
          navigator.clipboard
            ?.writeText(u.href)
            .then(() => {
              const b = $("shareBtn");
              b.textContent = "✓  Link copied";
              setTimeout(
                () => (b.textContent = "↗  Share this countdown"),
                1800,
              );
            })
            .catch(() => prompt("Copy this countdown URL:", u.href));
      }
      $("shareBtn").onclick = share;
      const countdownInterval = setInterval(update, 1000);
      update();
    </script>
  </body>
</html>
